<div class="specialist-container">
  <div class="page-header">
    <h2>Gestão de Especialistas e Clínicas</h2>
    <p-button label="Novo Especialista" icon="pi pi-plus" (click)="abrirModalNovo()" />
  </div>

  <!-- Tabela PrimeNG -->
  <p-table [value]="specialists" [tableStyle]="{ 'min-width': '60rem' }" styleClass="p-datatable-gridlines">
    <ng-template pTemplate="header">
      <tr>
        <th>Nome / Clínica</th>
        <th>Especialidade / Categoria</th>
        <th>Contato / Endereço</th>
        <th style="width: 100px; text-align: center;">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-spec>
      <tr>
        <td>{{ spec.name }}</td>
        <td>
          <span style="background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px; font-weight: 500; font-size: 0.85rem;">
            {{ spec.category }}
          </span>
        </td>
        <td>{{ spec.contactInfo }}</td>
        <td style="text-align: center;">
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (click)="excluirEspecialista(spec.id)" />
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Modal de Cadastro -->
  <p-dialog header="Cadastrar Novo Especialista" [(visible)]="displayModal" [modal]="true" [style]="{ width: '450px' }" [draggable]="false" [resizable]="false">
    <div class="form-group" style="margin-bottom: 1rem;">
      <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">
        Nome do Profissional / Clínica
        <span style="color: red;">*</span>
      </label>
      <input type="text" pInputText [(ngModel)]="novoSpecialist.name" placeholder="Ex: Dra. Carla / Clínica FonoVida" style="width: 100%;" />
    </div>

    <div class="form-group" style="margin-bottom: 1rem;">
      <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">
        Categoria / Especialidade
        <span style="color: red;">*</span>
      </label>
      <input type="text" pInputText [(ngModel)]="novoSpecialist.category" placeholder="Ex: Neuropediatra, Fonoaudiólogo, T.O." style="width: 100%;" />
    </div>

    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Contato (Telefone, E-mail ou Endereço)</label>
      <input type="text" pInputText [(ngModel)]="novoSpecialist.contactInfo" placeholder="Ex: (11) 98888-7777 / contato@clinica.com" style="width: 100%;" />
    </div>

    <ng-template pTemplate="footer">
      <p-button label="Cancelar" icon="pi pi-times" severity="secondary" (click)="displayModal = false" />
      <p-button 
        label="Salvar" 
        icon="pi pi-check" 
        (click)="salvarEspecialista()" 
        [disabled]="!novoSpecialist.name || !novoSpecialist.category" />
    </ng-template>
  </p-dialog>
</div>
