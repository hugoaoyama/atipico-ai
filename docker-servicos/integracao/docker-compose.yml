version: '3.8'

services:
  # --- CONTEINER DO FRONTEND (ANGULAR) ---
  frontend:
    build:
      context: ../../atipico-ai-frontend  # Caminho relativo até a raiz do Angular
      dockerfile: Dockerfile
      args:
        - ANGULAR_API_URL=${ANGULAR_API_URL} # Passa do seu arquivo .env para o Docker
    container_name: atipico_ai_frontend
    ports:
      - "4200:80"  # Expõe na porta 4200 da sua máquina (mapeada para a porta 80 do Nginx)
    restart: unless-stopped
    depends_on:
      - backend    # Garante que o backend inicialize antes do frontend

  # --- CONTEINER DO BACKEND (SPRING BOOT) ---
  backend:
    build:
      context: ../../atipicoAI      # Caminho relativo da pasta do compose até a raiz do projeto Java
      dockerfile: Dockerfile        # Nome do arquivo de build dentro daquela pasta
    container_name: atipico_ai_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Adicione outras variáveis aqui se necessário

  # --- GERENCIADOR (PORTAINER) ---
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

# --- VOLUMES PERSISTENTES ---
volumes:
  portainer_data:
