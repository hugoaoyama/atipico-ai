name: Continuous Integrations and Delivery with Github Actions

on:
  push:
    branches:  
      - "main" 

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container 
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME}}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

    - name: Login to Amazon ECR Private
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
 
    - name: Build with Maven
      working-directory: ./atipicoAI
      run: mvn clean package -DskipTests

    - name: Docker Compose Build
      working-directory: ./docker-servicos/backend
      run: docker compose build

    - name: Docker Push to Docker Hub
      working-directory: ./docker-servicos/backend
      run: |
        # The local image name generated by docker compose (folder name + service name)
        LOCAL_IMAGE="backend-backend:latest"
          
        # Target repository on Docker Hub
        TARGET_REPO="${{ secrets.DOCKER_USERNAME }}/backend-backend"

        # Tag for latest and run_id
        docker tag ${LOCAL_IMAGE} ${TARGET_REPO}:latest
        docker tag ${LOCAL_IMAGE} ${TARGET_REPO}:${{ github.run_id }}

        # Push both tags
        docker push ${TARGET_REPO}:latest
        docker push ${TARGET_REPO}:${{ github.run_id }}

    - name: Push to AWS ECR
      working-directory: ./docker-servicos/backend
      run: |
        # The local image name generated by docker compose (folder name + service name)
        LOCAL_IMAGE="backend-backend:latest"
          
        # Target repository on Docker Hub
        TARGET_REPO="${{ secrets.AWS_IMAGE_REPO_URL }}"

        # Tag for latest and run_id
        docker tag ${LOCAL_IMAGE} ${TARGET_REPO}:latest
        docker tag ${LOCAL_IMAGE} ${TARGET_REPO}:${{ github.run_id }}

        # Push both tags
        docker push ${TARGET_REPO}:latest
        docker push ${TARGET_REPO}:${{ github.run_id }}
