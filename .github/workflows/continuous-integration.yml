name: Continuous Integrations and Delivery with Github Actions

on:
  push:
    branches:  
      - "main" 

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container 
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME}}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
 
    - name: Build with Maven
      working-directory: ./atipicoAI
      run: mvn clean package -DskipTests

    - name: Docker Compose Build
      working-directory: ./docker-servicos/backend
      run: docker compose build

    - name: Docker Push to Docker Hub
      working-directory: ./docker-servicos/backend
      run: 
        docker tag ${{ secrets.DOCKER_USERNAME}}/backend/atipico_ai_backend:latest ${{ secrets.DOCKER_USERNAME}}/backend/atipico_ai_backend:${{ github.run_id }}
        docker push ${{ secrets.DOCKER_USERNAME}}/backend/atipico_ai_backend:latest
        docker push ${{ secrets.DOCKER_USERNAME}}/backend/atipico_ai_backend:${{ github.run_id }}
