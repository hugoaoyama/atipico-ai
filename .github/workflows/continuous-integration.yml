name: Continuous Integrations and Delivery with Github Actions

on:
  push:
    branches:  
      - "main" 

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container 
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME}}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

    - name: Login to Amazon ECR Private
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
 
    - name: Build with Maven
      working-directory: ./atipicoAI
      run: mvn clean package -DskipTests
   
    # 1. Configurar variáveis de ambiente para o Docker Compose de Integração ler os args do Angular e DB
    - name: Set up Environment Variables for Docker Compose
      run: |
        echo "ANGULAR_API_URL=${{ secrets.ANGULAR_API_URL }}" >> $GITHUB_ENV
        echo "DB_URL=${{ secrets.DB_URL }}" >> $GITHUB_ENV
        echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> $GITHUB_ENV
        echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
        echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> $GITHUB_ENV
        echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> $GITHUB_ENV
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV

    # 2. Build unificado (Frontend + Backend) usando o compose de integração
    - name: Docker Compose Build (Integration)
      working-directory: ./docker-servicos/integracao
      run: docker compose build

    - name: Docker Push to Docker Hub
      working-directory: ./docker-servicos/backend
      run: |
        # The local image name generated by docker compose (folder name + service name)
        LOCAL_IMAGE="integracao-backend:latest"
          
        # Target repository on Docker Hub
        TARGET_REPO="${{ secrets.DOCKER_USERNAME }}/integracao-backend"

        # Tag for latest and run_id
        docker tag ${LOCAL_IMAGE} ${TARGET_REPO}:latest
        docker tag ${LOCAL_IMAGE} ${TARGET_REPO}:${{ github.run_id }}

        # Push both tags
        docker push ${TARGET_REPO}:latest
        docker push ${TARGET_REPO}:${{ github.run_id }}

    - name: Push to AWS ECR
      working-directory: ./docker-servicos/integracao
      run: |
        # The local image name generated by docker compose (folder name + service name)
        LOCAL_IMAGE="integracao-backend:latest"
          
        # Target repository on Docker Hub
        TARGET_REPO="${{ secrets.AWS_IMAGE_REPO_URL }}"

        # Tag for latest and run_id
        docker tag ${LOCAL_IMAGE} ${TARGET_REPO}:latest
        docker tag ${LOCAL_IMAGE} ${TARGET_REPO}:${{ github.run_id }}

        # Push both tags
        docker push ${TARGET_REPO}:latest
        docker push ${TARGET_REPO}:${{ github.run_id }}

    # 5. Push do Frontend para a AWS ECR
    - name: Push Frontend to AWS ECR
      working-directory: ./docker-servicos/integracao
      run: |
        LOCAL_IMAGE="integracao-frontend:latest"
        TARGET_REPO="${{ secrets.AWS_FRONTEND_IMAGE_REPO_URL }}"

        docker tag ${LOCAL_IMAGE} ${TARGET_REPO}:latest
        docker tag ${LOCAL_IMAGE} ${TARGET_REPO}:${{ github.run_id }}

        docker push ${TARGET_REPO}:latest
        docker push ${TARGET_REPO}:${{ github.run_id }}

    - name: Download task definition
      run: |
        aws ecs describe-task-definition --task-definition ${{ secrets.AWS_TASK_DEFINITION_NAME }} --query taskDefinition > task-definition.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ secrets.AWS_CONTAINER_NAME }}
        image: ${{ secrets.AWS_IMAGE_REPO_URL }}:latest

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ secrets.AWS_SERVICE_NAME }}
        cluster: ${{ secrets.AWS_CLUSTER_NAME }}
        wait-for-service-stability: true

    # 7. Deploy do Frontend no AWS ECS
    - name: Download task definition (Frontend)
      run: |
        aws ecs describe-task-definition --task-definition ${{ secrets.AWS_FRONTEND_TASK_DEFINITION_NAME }} --query taskDefinition > task-definition-frontend.json

    - name: Fill in the new image ID in the Amazon ECS task definition (Frontend)
      id: task-def-frontend
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition-frontend.json
        container-name: ${{ secrets.AWS_FRONTEND_CONTAINER_NAME }}
        image: ${{ secrets.AWS_FRONTEND_IMAGE_REPO_URL }}:${{ github.run_id }}

    - name: Deploy Amazon ECS task definition (Frontend)
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def-frontend.outputs.task-definition }}
        service: ${{ secrets.AWS_FRONTEND_SERVICE_NAME }}
        cluster: ${{ secrets.AWS_CLUSTER_NAME }}
        wait-for-service-stability: true